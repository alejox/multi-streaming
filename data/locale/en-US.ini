Vertical.TwitchHelp="How it works"
Vertical.TwitchHelpTitle="Twitch Dual Format"
Vertical.TwitchHelpBody="<p>Twitch gets your horizontal canvas and this vertical one in one stream. Viewers holding their phone upright see this canvas; computers and TVs show the horizontal one.</p><p><b>To turn it on</b>, in OBS: <b>Settings → Stream</b></p><ol><li>Service: <b>Twitch</b>, and use <b>Connect Account</b> rather than pasting the key.</li><li>Tick <b>Enable Enhanced Broadcasting</b>.</li><li>Under <b>Additional Canvas</b> pick <b>obs-multi-stream-vertical</b>.</li><li>Go live with OBS's <b>Start Streaming</b>. Do not add Twitch as a destination of this plugin, or it would go out twice.</li></ol><p><b>To watch it while live:</b> the <b>Large view</b> button shows what goes out; on Twitch, the Stream Manager has an orientation button next to the preview's gear, and the phone app shows it in vertical.</p>"
